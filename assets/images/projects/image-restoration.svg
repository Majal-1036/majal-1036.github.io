<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Multi-degradation image restoration</title><desc id="desc">Noisy, blurry, and rain-corrupted patches are transformed into a clean restored image.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a33"/><stop offset="1" stop-color="#164b8f"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7ec8f2"/><stop offset="1" stop-color="#e5f4ff"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter></defs>
  <rect width="640" height="360" rx="26" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif" fill="#eaf3ff" font-size="13" font-weight="700" text-anchor="middle"><text x="106" y="50">NOISE</text><text x="258" y="50">BLUR</text><text x="410" y="50">RAIN</text><text x="559" y="50">RESTORED</text></g>
  <g transform="translate(40 70)"><g><rect width="132" height="210" rx="16" fill="url(#sky)"/><path d="M0 155l45-52 35 34 25-22 27 40v55H0z" fill="#3c799f"/><path d="M0 171l42-31 26 17 33-19 31 23v49H0z" fill="#28536e"/><g fill="#fff" opacity=".8"><circle cx="17" cy="22" r="2"/><circle cx="43" cy="61" r="2"/><circle cx="96" cy="28" r="3"/><circle cx="114" cy="92" r="2"/><circle cx="27" cy="126" r="3"/><circle cx="76" cy="98" r="2"/><circle cx="101" cy="183" r="3"/><circle cx="52" cy="190" r="2"/></g></g>
  <g transform="translate(152)" filter="url(#blur)"><rect width="132" height="210" rx="16" fill="url(#sky)"/><path d="M0 155l45-52 35 34 25-22 27 40v55H0z" fill="#3c799f"/><path d="M0 171l42-31 26 17 33-19 31 23v49H0z" fill="#28536e"/></g>
  <g transform="translate(304)"><rect width="132" height="210" rx="16" fill="url(#sky)"/><path d="M0 155l45-52 35 34 25-22 27 40v55H0z" fill="#3c799f"/><path d="M0 171l42-31 26 17 33-19 31 23v49H0z" fill="#28536e"/><g stroke="#fff" stroke-width="3" opacity=".72"><path d="M10 17l15 34M42 4l17 38M73 23l18 40M106 9l16 36M23 83l17 37M63 74l18 43M101 68l20 46M10 137l20 43M54 129l20 42M95 121l21 44"/></g></g>
  <g transform="translate(456)"><rect width="132" height="210" rx="16" fill="url(#sky)" stroke="#6fd8ff" stroke-width="4"/><circle cx="94" cy="42" r="19" fill="#ffd166"/><path d="M0 155l45-52 35 34 25-22 27 40v55H0z" fill="#3c799f"/><path d="M0 171l42-31 26 17 33-19 31 23v49H0z" fill="#28536e"/></g></g>
  <g fill="none" stroke="#6fd8ff" stroke-width="4"><path d="M477 298H542"/><path d="M533 291l14 7-14 7z"/></g><text x="477" y="326" fill="#bfe9ff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DEEP UNFOLDING</text>
</svg>
