<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Extreme value bounds for vision-based control</title><desc id="desc">A nominal control trajectory is surrounded by a statistical error envelope with an inset tail distribution.</desc>
