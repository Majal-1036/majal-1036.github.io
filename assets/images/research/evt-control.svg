  <rect width="640" height="360" rx="26" fill="url(#bg)"/>
  <g opacity=".18" stroke="#b9d8ff"><path d="M45 58H595M45 118H595M45 178H595M45 238H595M45 298H595"/><path d="M95 35V322M175 35V322M255 35V322M335 35V322M415 35V322M495 35V322M575 35V322"/></g>
